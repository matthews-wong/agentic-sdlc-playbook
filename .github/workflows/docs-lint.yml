name: docs-lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "**/*.md"

  linkcheck:
    name: link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links with lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Accept bot-block (403) and rate-limit (429) as non-failures: many
          # sites reject automated agents even though the page is live. Real
          # 404s still fail. Live-but-blocking domains are in .lycheeignore.
          # Internal file/#anchor links are strictly enforced by the separate
          # anchor-links job (scripts/check_links.py).
          args: "--no-progress --max-retries 2 --accept 200,206,403,429 './**/*.md'"
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  example-tests:
    name: example tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run example tests (mock backend, no network)
        run: |
          python -m pip install --upgrade pip pytest
          for dir in examples/*/; do
            echo "== $dir ==" && (cd "$dir" && python -m pytest -q)
          done

  anchor-links:
    name: internal anchor links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate internal file + #anchor links
        run: python scripts/check_links.py
